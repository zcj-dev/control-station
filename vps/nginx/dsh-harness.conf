map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 23.95.35.82.nip.io;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host:8444$request_uri; }
}

server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    server_name 23.95.35.82.nip.io;

    ssl_certificate     /etc/letsencrypt/live/23.95.35.82.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/23.95.35.82.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location = / { return 302 /h/; }

    location /h/api/remote.mux {
        proxy_pass http://100.117.110.112:3081/api/remote.mux;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /h/plugins/events {
        proxy_pass http://100.117.110.112:3081/plugins/events;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /h/api/our-free-model/events {
        proxy_pass http://100.117.110.112:3081/api/our-free-model/events;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /h/ {
        proxy_pass http://100.117.110.112:3081/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        error_page 401 = @need_key;
    }

    location @need_key {
        default_type text/html;
        return 403 "<html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>需要访问口令</title></head><body style='font-family:system-ui;padding:40px'><h2>需要访问口令</h2><p>请使用完整链接访问: <code>https://23.95.35.82.nip.io:8444/h/d/?k=YOUR-KEY</code></p></body></html>";
    }
}